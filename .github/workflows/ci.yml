name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------
  # 1. Tests y build de microservicios (matriz por servicio)
  # -----------------------------------------------------------
  test-microservices:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api-svc, analysis-svc, payment-svc, notification-svc, admin-svc]
    # Redis para los tests de integración de la cola (analysis-svc). Las demás
    # patas de la matriz no lo usan, pero el overhead es mínimo.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.service }}

      - name: Build
        run: npm run build
        working-directory: ${{ matrix.service }}

      - name: Run tests
        # `--if-present`: api-svc todavía no tiene suite de tests. Sin esto el
        # job falla con "Missing script: test" y deja el CI en rojo permanente.
        run: npm test --if-present
        working-directory: ${{ matrix.service }}
        env:
          # Solo analysis-svc lo usa: activa los tests de integración de la
          # cola (scripts Lua) contra el service Redis del job.
          REDIS_TEST_URL: ${{ matrix.service == 'analysis-svc' && 'redis://localhost:6379' || '' }}

      - name: Benchmark del motor de análisis
        if: matrix.service == 'analysis-svc'
        run: npm run benchmark -- --strict
        working-directory: analysis-svc

  # -----------------------------------------------------------
  # 2. Tests y build del frontend (Next.js)
  # -----------------------------------------------------------
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Type check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Run unit tests
        run: npm test
        working-directory: frontend

  # -----------------------------------------------------------
  # 3. Lint (incremental): instala deps por servicio y ejecuta linters
  #    disponibles. Se mantiene continue-on-error mientras se limpia la
  #    deuda histórica; objetivo: convertir en gate por servicio de forma
  #    progresiva (quitar continue-on-error cuando cada uno esté limpio).
  # -----------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install analysis-svc deps
        run: npm ci
        working-directory: analysis-svc
        continue-on-error: true

      - name: Lint analysis-svc
        run: npm run lint --if-present
        working-directory: analysis-svc
        continue-on-error: true

      - name: Install payment-svc deps
        run: npm ci
        working-directory: payment-svc
        continue-on-error: true

      - name: Lint payment-svc
        run: npm run lint --if-present
        working-directory: payment-svc
        continue-on-error: true

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend
        continue-on-error: true

      - name: Lint frontend
        run: npx next lint
        working-directory: frontend
        continue-on-error: true

      - name: Install api-svc deps
        run: npm ci
        working-directory: api-svc
        continue-on-error: true

      - name: Lint api-svc
        run: npm run lint --if-present
        working-directory: api-svc
        continue-on-error: true

      - name: Install notification-svc deps
        run: npm ci
        working-directory: notification-svc
        continue-on-error: true

      - name: Lint notification-svc
        run: npm run lint --if-present
        working-directory: notification-svc
        continue-on-error: true

      - name: Install admin-svc deps
        run: npm ci
        working-directory: admin-svc
        continue-on-error: true

      - name: Lint admin-svc
        run: npm run lint --if-present
        working-directory: admin-svc
        continue-on-error: true

  # -----------------------------------------------------------
  # 4. Tests E2E (Playwright) contra frontend en desarrollo
  # -----------------------------------------------------------
  test-e2e:
    # Pin a 24.04: Playwright 1.59.x no soporta instalar deps en ubuntu 26.04 (ubuntu-latest).
    runs-on: ubuntu-24.04
    needs: [test-frontend]
    # Valores dummy: los smoke tests E2E solo recorren páginas públicas. Sin
    # estas variables, @supabase/ssr lanza al construir los clientes de login
    # (browser/server) y del middleware, por lo que las páginas no renderizan.
    # Deben estar definidas al arrancar `next dev` porque NEXT_PUBLIC_* se inlinea.
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Start Next.js dev server
        run: npm run dev &
        working-directory: frontend

      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000 > /dev/null 2>&1; then
              echo "Server is ready"
              exit 0
            fi
            echo "Waiting for server... ($i/30)"
            sleep 2
          done
          echo "Server did not start in time"
          exit 1
        working-directory: frontend

      - name: Run E2E tests
        run: npx playwright test
        working-directory: frontend
        env:
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          E2E_URL: http://localhost:3000

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # -----------------------------------------------------------
  # 5. Verificar que Dockerfiles builds (sin push, solo validar)
  # -----------------------------------------------------------
  docker-build-check:
    runs-on: ubuntu-latest
    needs: [test-microservices, test-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Dockerfiles
        run: |
          for svc in api-svc analysis-svc payment-svc notification-svc admin-svc; do
            echo "=== Validando $svc ==="
            docker build --target builder -t "cobrodetector/${svc}:check" -f "${svc}/Dockerfile" "${svc}" || exit 1
          done
