name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------
  # 1. Tests y build de microservicios (matriz por servicio)
  # -----------------------------------------------------------
  test-microservices:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api-svc, analysis-svc, payment-svc, notification-svc, admin-svc]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.service }}

      - name: Build
        run: npm run build
        working-directory: ${{ matrix.service }}

      - name: Run tests
        run: npm test
        working-directory: ${{ matrix.service }}

  # -----------------------------------------------------------
  # 2. Tests y build del frontend (Next.js)
  # -----------------------------------------------------------
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Type check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Run unit tests
        run: npm test
        working-directory: frontend

  # -----------------------------------------------------------
  # 3. Lint de todos los servicios
  # -----------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root deps (if any)
        run: npm ci
        continue-on-error: true

      - name: Lint analysis-svc
        run: npm run lint
        working-directory: analysis-svc
        continue-on-error: true

      - name: Lint payment-svc
        run: npm run lint
        working-directory: payment-svc
        continue-on-error: true

      - name: Lint frontend
        run: npx next lint
        working-directory: frontend
        continue-on-error: true

  # -----------------------------------------------------------
  # 4. Tests E2E (Playwright) contra frontend en desarrollo
  # -----------------------------------------------------------
  test-e2e:
    runs-on: ubuntu-latest
    needs: [test-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Start Next.js dev server
        run: npm run dev &
        working-directory: frontend

      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -s http://localhost:3000 > /dev/null 2>&1; then
              echo "Server is ready"
              exit 0
            fi
            echo "Waiting for server... ($i/30)"
            sleep 2
          done
          echo "Server did not start in time"
          exit 1
        working-directory: frontend

      - name: Run E2E tests
        run: npx playwright test
        working-directory: frontend
        env:
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
          E2E_URL: http://localhost:3000

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # -----------------------------------------------------------
  # 5. Verificar que Dockerfiles builds (sin push, solo validar)
  # -----------------------------------------------------------
  docker-build-check:
    runs-on: ubuntu-latest
    needs: [test-microservices, test-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Dockerfiles
        run: |
          for svc in api-svc analysis-svc payment-svc notification-svc admin-svc; do
            echo "=== Validando $svc ==="
            docker build --target builder -t "cobrodetector/${svc}:check" -f "${svc}/Dockerfile" "${svc}" || exit 1
          done
