name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------
  # 1. Tests y build de microservicios (matriz por servicio)
  # -----------------------------------------------------------
  test-microservices:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api-svc, analysis-svc, payment-svc, notification-svc, admin-svc]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.service }}

      - name: Build
        run: npm run build
        working-directory: ${{ matrix.service }}

      - name: Run tests
        run: npm test
        working-directory: ${{ matrix.service }}

  # -----------------------------------------------------------
  # 2. Tests y build del frontend (Next.js)
  # -----------------------------------------------------------
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Type check
        run: npx tsc --noEmit
        working-directory: frontend

      - name: Run unit tests
        run: npm test
        working-directory: frontend

  # -----------------------------------------------------------
  # 3. Lint de todos los servicios
  # -----------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root deps (if any)
        run: npm ci
        continue-on-error: true

      - name: Lint analysis-svc
        run: npm run lint
        working-directory: analysis-svc
        continue-on-error: true

      - name: Lint payment-svc
        run: npm run lint
        working-directory: payment-svc
        continue-on-error: true

      - name: Lint frontend
        run: npx next lint
        working-directory: frontend
        continue-on-error: true

  # -----------------------------------------------------------
  # 4. Verificar que Dockerfiles builds (sin push, solo validar)
  # -----------------------------------------------------------
  docker-build-check:
    runs-on: ubuntu-latest
    needs: [test-microservices, test-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Dockerfiles
        run: |
          for svc in api-svc analysis-svc payment-svc notification-svc admin-svc; do
            echo "=== Validando $svc ==="
            docker build --target builder -t "cobrodetector/${svc}:check" -f "${svc}/Dockerfile" "${svc}" || exit 1
          done
