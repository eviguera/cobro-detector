# Supabase corre en el host (supabase start), no dentro de esta red de Compose.
# Dentro de un contenedor 127.0.0.1 apunta al propio contenedor, así que hay que
# usar host.docker.internal para alcanzar el Supabase del host.
# Sobreescribir con DOCKER_SUPABASE_URL si se usa un Supabase remoto.
x-supabase-host-env: &supabase-host-env
  SUPABASE_URL: ${DOCKER_SUPABASE_URL:-http://host.docker.internal:54321}
  NEXT_PUBLIC_SUPABASE_URL: ${DOCKER_SUPABASE_URL:-http://host.docker.internal:54321}

x-docker-host: &docker-host
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-common-runtime: &common-runtime
  NODE_ENV: ${NODE_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  SENTRY_DSN: ${SENTRY_DSN:-}

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  api-svc:
    build: ./api-svc
    ports:
      - "3004:3004"
    environment:
      <<: [*supabase-host-env, *common-runtime]
      PORT: 3004
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      JWT_SECRET: ${JWT_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    <<: *docker-host
    depends_on:
      - analysis-svc
      - payment-svc
      - notification-svc
      - admin-svc

  analysis-svc:
    build: ./analysis-svc
    ports:
      - "3001:3001"
    environment:
      <<: [*supabase-host-env, *common-runtime]
      PORT: 3001
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      JWT_SECRET: ${JWT_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-supabase}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      ANALYSIS_KEY_ENCRYPTION_KEY: ${ANALYSIS_KEY_ENCRYPTION_KEY:-}
      QUEUE_MAX_ATTEMPTS: ${QUEUE_MAX_ATTEMPTS:-3}
      QUEUE_STALE_SECONDS: ${QUEUE_STALE_SECONDS:-600}
      QUEUE_REAP_INTERVAL_SECONDS: ${QUEUE_REAP_INTERVAL_SECONDS:-60}
      QUEUE_POLL_INTERVAL_MS: ${QUEUE_POLL_INTERVAL_MS:-500}
      QUEUE_HARD_SHUTDOWN_SECONDS: ${QUEUE_HARD_SHUTDOWN_SECONDS:-30}
    <<: *docker-host
    depends_on:
      - redis

  # Worker de la cola de análisis: misma imagen, proceso aparte (src/worker.ts).
  # Escala CPU (parseo/IA) independiente del HTTP y sobrevive a redeploys del
  # servidor con shutdown elegante (SIGTERM).
  analysis-worker:
    build: ./analysis-svc
    command: ["node", "--env-file-if-exists=.env", "dist/worker.js"]
    environment:
      <<: [*supabase-host-env, *common-runtime]
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      JWT_SECRET: ${JWT_SECRET:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-supabase}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      ANALYSIS_KEY_ENCRYPTION_KEY: ${ANALYSIS_KEY_ENCRYPTION_KEY:-}
      QUEUE_MAX_ATTEMPTS: ${QUEUE_MAX_ATTEMPTS:-3}
      QUEUE_STALE_SECONDS: ${QUEUE_STALE_SECONDS:-600}
      QUEUE_REAP_INTERVAL_SECONDS: ${QUEUE_REAP_INTERVAL_SECONDS:-60}
      QUEUE_POLL_INTERVAL_MS: ${QUEUE_POLL_INTERVAL_MS:-500}
      QUEUE_HARD_SHUTDOWN_SECONDS: ${QUEUE_HARD_SHUTDOWN_SECONDS:-30}
    <<: *docker-host
    depends_on:
      - redis

  payment-svc:
    build: ./payment-svc
    ports:
      - "3002:3002"
    environment:
      <<: [*supabase-host-env, *common-runtime]
      PORT: 3002
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      JWT_SECRET: ${JWT_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
      NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY: ${NEXT_PUBLIC_MERCADOPAGO_PUBLIC_KEY:-}
      PAYMENT_SERVICE_URL: ${PAYMENT_SERVICE_URL:-}
      PAYMENT_SVC_PUBLIC_URL: ${PAYMENT_SVC_PUBLIC_URL:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
    <<: *docker-host

  notification-svc:
    build: ./notification-svc
    ports:
      - "3003:3003"
    environment:
      <<: [*supabase-host-env, *common-runtime]
      PORT: 3003
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      JWT_SECRET: ${JWT_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      FROM_EMAIL: ${FROM_EMAIL:-}
      CRON_SECRET: ${CRON_SECRET:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
    <<: *docker-host

  admin-svc:
    build: ./admin-svc
    ports:
      - "3005:3005"
    environment:
      <<: [*supabase-host-env, *common-runtime]
      PORT: 3005
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      JWT_SECRET: ${JWT_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    <<: *docker-host

volumes:
  redis_data:
